<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firefly Dashboard</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const t = localStorage.getItem('ffd-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 21.5 14 15l4 3.5 5.5-7.5" fill="none" stroke="var(--surface-1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Firefly<b>Dashboard</b></span>
      </a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="#/" data-route="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-4H4zm10-16v4h6V4z"/></svg><span>Übersicht</span></a>
        <a href="#/kategorien" data-route="categories"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Kategorien</span></a>
        <a href="#/tags" data-route="tags"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg><span>Tags</span></a>
        <a href="#/wiederkehrend" data-route="recurring"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg><span>Wiederkehrend</span></a>
        <a href="#/buchungen" data-route="transactions"><svg viewBox="0 0 24 24"><path d="M7 7h13M7 7l3-3M7 7l3 3M17 17H4m13 0-3-3m3 3-3 3"/></svg><span>Buchungen</span></a>
        <a href="#/konten" data-route="accounts"><svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6M5 10v8m4.7-8v8m4.6-8v8M19 10v8M3 20h18"/></svg><span>Konten</span></a>
        <a href="#/automationen" data-route="actions"><svg viewBox="0 0 24 24"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg><span>Automationen</span></a>
      </nav>
      <div class="sidebar-foot" id="instance-info"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Übersicht</h1>
        <div class="topbar-actions">
          <div class="search" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="global-search" type="search" placeholder="Suchen …" autocomplete="off" aria-label="Kategorien, Konten und Buchungen suchen" aria-controls="search-results" aria-expanded="false">
            <kbd>/</kbd>
            <div class="search-results" id="search-results" role="listbox" hidden></div>
          </div>
          <div class="period-wrap">
            <label class="period">
              <span class="sr-only">Zeitraum</span>
              <select id="period-select"></select>
            </label>
            <form class="custom-range" id="custom-range" hidden>
              <label>Von <input type="date" id="cr-from" required></label>
              <label>Bis <input type="date" id="cr-to" required></label>
              <div class="custom-actions"><button type="button" class="btn" id="cr-cancel">Abbrechen</button><button type="submit" class="btn primary">Übernehmen</button></div>
            </form>
          </div>
          <button class="icon-btn toggle" id="forecast-btn" aria-pressed="false" aria-label="Prognose ein/aus">
            <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 4-6"/><path d="M16 9l5-4" stroke-dasharray="2 2.5"/><circle cx="21" cy="5" r="0.6"/></svg>
          </button>
          <button class="icon-btn" id="refresh-btn" title="Neu laden" aria-label="Neu laden">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
          <button class="icon-btn" id="theme-btn" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">
            <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          </button>
        </div>
      </header>
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
